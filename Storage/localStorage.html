<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local-Storage</title>
</head>
<body>
<h2>local-Storage</h2>
<input type="text" name="" placeholder="NAME HERE!!" id="input">
<button onclick="savedname()">SAVE</button>
<button onclick="deletename()">DELETE</button>
<p id="display"></p>


<script>
        function savedname(){
            const name = document.getElementById("input").value;
            if (name === ""){
                alert("pehle naam likho")
            return;
            }
            localStorage.setItem("username" , name);
            document.getElementById("display").textContent = "saved ho gya" + name;
        }

        function deletename(){
            localStorage.removeItem("username");
            document.getElementById("input").value = "";
            document.getElementById("display").textContent = "naam delete"
        }


</script>
</body>
</html>
