<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calender</title>
    <link rel="stylesheet" href="Calender.css">
</head>
<body>
    <div class="container">
        <h1>Today is ...</h1>
        <div class="cal">
            <div class="left">
                <p class="date">0</p>
                <p class="day">Sunday</p>

            </div>
            <div class="right">
                <p class="month">january</p>
                <p class="year">2024</p>
            </div>
        </div>
    </div>
<script src="Calender.js"></script>
</body>
</html>
