<!DOCTYPE html>
<html>
<head>
  <title>Color Generator</title>
</head>
<body style=" display: flex; justify-content:center; align-items: center; background: #000 ; color: white;" >
  
<div class="container  " style="height: 90vh;  width: 100%; display: flex; justify-content: center; align-items: center;">
<div class="container2" style="height: 30vh;flex-direction: column;  
border-radius: 30px;  background: white; color: #000;
border: 4px solid rgb(0, 0, 0); width: 40%; display: flex;
justify-content: space-evenly; align-items: center;">
    <h1 style="letter-spacing: 6px;">Background Color Generator</h1>
    <button onclick="chnga()" style=" 
    cursor: pointer; box-shadow: 0 0 10px rgba(0, 0, 0, 0.304);
    background-color: rgb(58, 58, 58); color: black; padding: 10px 20px; border-radius: 30px;
    letter-spacing: 5px; font-weight: bolder;
    border: 10px solid rgb(0, 0, 0);">change The backGround COLOR</button>
</div>

</div>


<script>
  

  function chnga(){
    setInterval(() => {
      let r = Math.floor(Math.random() * 256);
      let g = Math.floor(Math.random() * 256);
      let b = Math.floor(Math.random() * 256);

      document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
    }, 1000);
  } 

</script>

</body>
</html>
