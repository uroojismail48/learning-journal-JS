<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Item Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <style>
    .paise{
        display: flex;
    }
    .card-body{
        background-color: black;
        color: white;
    }
    #Currency{
        background-color: black;
        color: white;
    }
    .price{
        margin-top: 10px;
        margin-left: 10px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font:bold;
    }
  </style>
</head>
<body class="bg-dark">

  <div class="container mt-5">
    <div class="row justify-content-center">

      <div class="col-md-4">
        <div class="card shadow-sm">

          <!-- Item Image -->
          <img
            src="plastic-classic-framed-glasses-png.png"
            class="card-img-top"
            style="height: 250px;"
            alt="Item Image"
          >

          <!-- Card Body -->
          <div class="card-body">
            <h5 class="card-title">glasses</h5>
            <p class="card-text">
             best glasses ever!!!
            </p>
<select id="Currency" class="form-select mb-2">
  <option value="USD">USD ($)</option>
  <option value="PKR">PKR (₨)</option>
  <option value="IND">INR (₹)</option>
</select>

            <div class="paise">
   
    <p class="price"  data-price="10">$10</p></div>
            <a href="#" class="btn btn-dark w-100 mt-2">
              Add to Cart
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
  
  const rates = {
    USD: 1,
    PKR: 100,
    IND: 50
  };

  const symbols = {
    USD: "$",
    PKR: "₨",
    IND: "₹"
  };

  document.getElementById("Currency").addEventListener("change", function () {
    const currency_selected = this.value;

    document.querySelectorAll(".price").forEach(item => {
      const basePrice = Number(item.dataset.price);
      const converted = basePrice * rates[currency_selected];
      item.innerHTML = symbols[currency_selected] + converted;
    });
  });


  </script>
</body>
</html>
