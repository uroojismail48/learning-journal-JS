<!DOCTYPE html>
<html>
<head>
  <title>Advanced Filter</title>

 <link rel="stylesheet" href="Complete.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-4">

  <!-- Search -->
  <input type="text" id="search" class="form-control mb-3" placeholder="Search product...">

  <!-- Price Range -->
  <label class="form-label">Max Price: Rs <span id="priceValue">100000</span></label>
  <input type="range" id="priceRange" class="form-range mb-4" min="0" max="100000" step="1000" value="100000">

  <!-- Category Buttons -->
  <div class="mb-4 text-center">
    <button class="btn btn-outline-dark filter-btn active" data-filter="all">All</button>
    <button class="btn btn-outline-dark filter-btn" data-filter="mobile">Mobile</button>
    <button class="btn btn-outline-dark filter-btn" data-filter="laptop">Laptop</button>
    <button class="btn btn-outline-dark filter-btn" data-filter="accessory">Accessory</button>
  </div>

  <!-- Products -->
  <div class="row g-3" id="grid">
    <div class="col-md-3 item" data-category="mobile" data-price="30000">📱 Samsung – 30k</div>
    <div class="col-md-3 item" data-category="mobile" data-price="80000">📱 iPhone – 80k</div>
    <div class="col-md-3 item" data-category="laptop" data-price="90000">💻 Dell – 90k</div>
    <div class="col-md-3 item" data-category="accessory" data-price="5000">🎧 Headphones – 5k</div>
  </div>

</div>
<script src="complete.js"></script>
